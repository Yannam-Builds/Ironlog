<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="loop-title loop-desc">
  <title id="loop-title">The IronLog training loop</title>
  <desc id="loop-desc">Four connected steps: record a set, assess recovery, credit the completed work, and adjust the next session.</desc>
  <style>
    :root { --bg:#050505; --panel:#111; --line:#363636; --text:#fff; --muted:#aaa; --forge:#ff4500; --ready:#00c170; --earned:#ffd700; }
    @media (prefers-color-scheme: light) { :root { --bg:#f6f7f8; --panel:#fff; --line:#c9cdd2; --text:#111; --muted:#505761; --forge:#d93600; --ready:#087f4d; --earned:#8a6100; } }
    .current { stroke-dasharray:6 10; animation:flow 3s linear infinite; }
    .marker { animation:steps 10s ease-in-out infinite; }
    @keyframes flow { to { stroke-dashoffset:-32; } }
    @keyframes steps { 0%,12% { transform:translateX(0); } 29%,39% { transform:translateX(290px); } 56%,66% { transform:translateX(580px); } 83%,94% { transform:translateX(870px); } 100% { transform:translateX(0); } }
    @media (prefers-reduced-motion: reduce) { .current,.marker { animation:none; } .marker { transform:translateX(870px); } }
  </style>
  <rect width="1200" height="320" rx="20" fill="var(--bg)"/>
  <text x="44" y="51" fill="var(--text)" font-family="Arial,sans-serif" font-size="25" font-weight="800">One continuous training record</text>
  <text x="44" y="80" fill="var(--muted)" font-family="Arial,sans-serif" font-size="16">Each decision keeps the evidence from the session before it.</text>
  <path d="M144 119H1014" stroke="var(--line)" stroke-width="2"/>
  <path d="M144 119H1014" stroke="var(--forge)" stroke-width="2" class="current"/>
  <circle cx="144" cy="119" r="7" fill="var(--forge)" class="marker"/>
  <g font-family="Arial,sans-serif">
    <g transform="translate(35 146)">
      <rect width="242" height="132" rx="14" fill="var(--panel)" stroke="var(--line)"/>
      <text x="18" y="29" fill="var(--forge)" font-size="14" font-weight="800" letter-spacing="2">01 / TRAIN</text>
      <text x="18" y="67" fill="var(--text)" font-size="23" font-weight="800">Record the set</text>
      <text x="18" y="96" fill="var(--muted)" font-size="15">Load, reps and effort</text>
    </g>
    <g transform="translate(325 146)">
      <rect width="242" height="132" rx="14" fill="var(--panel)" stroke="var(--line)"/>
      <text x="18" y="29" fill="var(--ready)" font-size="14" font-weight="800" letter-spacing="2">02 / RECOVER</text>
      <text x="18" y="67" fill="var(--text)" font-size="23" font-weight="800">Read the context</text>
      <text x="18" y="96" fill="var(--muted)" font-size="15">History and check-in</text>
    </g>
    <g transform="translate(615 146)">
      <rect width="242" height="132" rx="14" fill="var(--panel)" stroke="var(--line)"/>
      <text x="18" y="29" fill="var(--earned)" font-size="14" font-weight="800" letter-spacing="2">03 / PROVE</text>
      <text x="18" y="67" fill="var(--text)" font-size="23" font-weight="800">Credit the work</text>
      <text x="18" y="96" fill="var(--muted)" font-size="15">Streaks, PRs and Ledger</text>
    </g>
    <g transform="translate(905 146)">
      <rect width="242" height="132" rx="14" fill="var(--panel)" stroke="var(--line)"/>
      <text x="18" y="29" fill="var(--text)" font-size="14" font-weight="800" letter-spacing="2">04 / REPEAT</text>
      <text x="18" y="67" fill="var(--text)" font-size="23" font-weight="800">Adjust the plan</text>
      <text x="18" y="96" fill="var(--muted)" font-size="15">A better next session</text>
    </g>
  </g>
</svg>
