<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">IronLog — Train. Recover. Prove it.</title>
  <desc id="hero-desc">A workout set becomes recovery context and then an earned ledger entry. A signal moves through the three stages.</desc>
  <style>
    :root { --bg:#050505; --panel:#101010; --line:#303030; --text:#fff; --muted:#aaa; --forge:#ff4500; --ready:#00c170; --earned:#ffd700; }
    @media (prefers-color-scheme: light) { :root { --bg:#f6f7f8; --panel:#fff; --line:#c9cdd2; --text:#111; --muted:#505761; --forge:#d93600; --ready:#087f4d; --earned:#8a6100; } }
    .signal { animation: travel 8s ease-in-out infinite; }
    .path { stroke-dasharray:5 9; animation: current 2.8s linear infinite; }
    .earned { animation: arrive 8s ease-in-out infinite; }
    @keyframes travel { 0%,10% { transform:translateY(0); } 38%,48% { transform:translateY(104px); } 75%,90% { transform:translateY(208px); } 100% { transform:translateY(0); } }
    @keyframes current { to { stroke-dashoffset:-28; } }
    @keyframes arrive { 0%,68% { opacity:.36; } 77%,94% { opacity:1; } 100% { opacity:.36; } }
    @media (prefers-reduced-motion: reduce) { .signal,.path,.earned { animation:none; } .signal { transform:translateY(208px); } .earned { opacity:1; } }
  </style>
  <rect width="1200" height="480" rx="24" fill="var(--bg)"/>
  <path d="M48 48H1152M48 432H1152" stroke="var(--line)"/>
  <text x="64" y="99" fill="var(--forge)" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="3">THE WORK IS THE RECORD</text>
  <text x="58" y="213" fill="var(--text)" font-family="Arial,sans-serif" font-size="86" font-weight="900" letter-spacing="-5">IRONLOG</text>
  <text x="64" y="270" fill="var(--text)" font-family="Arial,sans-serif" font-size="29" font-weight="700">Train. Recover. Prove it.</text>
  <text x="64" y="323" fill="var(--muted)" font-family="Arial,sans-serif" font-size="18">Log the set. Read the recovery.</text>
  <text x="64" y="351" fill="var(--muted)" font-family="Arial,sans-serif" font-size="18">Carry the evidence into the next session.</text>
  <rect x="64" y="381" width="208" height="31" rx="15" fill="var(--panel)" stroke="var(--line)"/>
  <circle cx="84" cy="396.5" r="5" fill="var(--ready)"/>
  <text x="99" y="402" fill="var(--text)" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1">LOCAL-FIRST BY DESIGN</text>
  <rect x="648" y="70" width="504" height="340" rx="18" fill="var(--panel)" stroke="var(--line)"/>
  <text x="681" y="109" fill="var(--muted)" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2.5">A SINGLE TRAINING LOOP</text>
  <path d="M699 127H1117" stroke="var(--line)"/>
  <path d="M710 164V372" stroke="var(--line)" stroke-width="2"/>
  <path d="M710 164V372" stroke="var(--forge)" stroke-width="2" class="path"/>
  <circle cx="710" cy="164" r="7" fill="var(--forge)" stroke="var(--panel)" stroke-width="3" class="signal"/>
  <g font-family="Arial,sans-serif">
    <circle cx="710" cy="164" r="19" fill="var(--panel)" stroke="var(--forge)" stroke-width="2"/>
    <path d="M701 164h18m-14-8v16m10-16v16" stroke="var(--forge)" stroke-width="2.5" stroke-linecap="round"/>
    <text x="754" y="159" fill="var(--text)" font-size="19" font-weight="800">LOG THE SET</text>
    <text x="754" y="181" fill="var(--muted)" font-size="14">Load · reps · effort</text>
    <circle cx="710" cy="268" r="19" fill="var(--panel)" stroke="var(--ready)" stroke-width="2"/>
    <path d="M700 271a11 11 0 1 1 10 8" fill="none" stroke="var(--ready)" stroke-width="2.5" stroke-linecap="round"/>
    <text x="754" y="263" fill="var(--text)" font-size="19" font-weight="800">READ RECOVERY</text>
    <text x="754" y="285" fill="var(--muted)" font-size="14">History · check-in · readiness</text>
    <circle cx="710" cy="372" r="19" fill="var(--panel)" stroke="var(--earned)" stroke-width="2" class="earned"/>
    <path d="M700 372l7 7 13-15" fill="none" stroke="var(--earned)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="earned"/>
    <text x="754" y="367" fill="var(--text)" font-size="19" font-weight="800">EARN THE RECORD</text>
    <text x="754" y="389" fill="var(--muted)" font-size="14">Credited work · durable progress</text>
  </g>
</svg>
