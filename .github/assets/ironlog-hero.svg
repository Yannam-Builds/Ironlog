<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">IronLog — Train. Recover. Prove it.</title>
  <desc id="hero-desc">IronLog's strength and cardio training log. A workout card shows set progress and a rest timer, and a GPS card draws a running route with distance and pace. Theme dots show Shift Green, Onyx Green, Midnight Blue and Royal Amethyst.</desc>
  <style>
    :root { --bg:#141414; --panel:#1f1f1f; --card:#272727; --line:#414741; --text:#f0f4f0; --muted:#a1ada3; --mint:#65da94; --blue:#86bdff; --faint:#3a433c; }
    @media (prefers-color-scheme: light) { :root { --bg:#f4f6f4; --panel:#ffffff; --card:#eef2ee; --line:#c8d0c9; --text:#101511; --muted:#4f5b52; --mint:#18834d; --blue:#1d5fb4; --faint:#d5ddd6; } }
    .route { stroke-dasharray:620; stroke-dashoffset:0; animation:draw 7s ease-in-out infinite; }
    .runner-static { display:none; }
    .progress { stroke-dasharray:1400; stroke-dashoffset:1150; animation:fill 7s ease-in-out infinite; }
    .wave { animation:flow 2.4s linear infinite; }
    .breathe { transform-box:fill-box; transform-origin:center; animation:breathe 3.2s ease-in-out infinite; }
    .pulse { animation:pulse 2.4s ease-in-out infinite; }
    @keyframes draw { 0% { stroke-dashoffset:0; } 4% { stroke-dashoffset:620; } 8% { stroke-dashoffset:620; } 60%,92% { stroke-dashoffset:0; } 100% { stroke-dashoffset:0; } }
    @keyframes fill { 0%,6% { stroke-dashoffset:1150; } 55%,92% { stroke-dashoffset:700; } 100% { stroke-dashoffset:1150; } }
    @keyframes flow { to { transform:translateX(-36px); } }
    @keyframes breathe { 0%,100% { transform:scaleY(.6); } 50% { transform:scaleY(1); } }
    @keyframes pulse { 0%,100% { opacity:.45; } 50% { opacity:1; } }
    @media (prefers-reduced-motion: reduce) {
      .route,.progress,.wave,.breathe,.pulse { animation:none; }
      .route { stroke-dashoffset:0; } .progress { stroke-dashoffset:700; }
      .runner { display:none; } .runner-static { display:inline; }
    }
  </style>
  <rect width="1200" height="520" rx="26" fill="var(--bg)"/>

  <!-- Identity -->
  <g font-family="Arial,Helvetica,sans-serif">
    <text x="64" y="104" fill="var(--mint)" font-size="15" font-weight="700" letter-spacing="3">STRENGTH · CARDIO · RECOVERY</text>
    <text x="58" y="210" fill="var(--text)" font-size="92" font-weight="900" letter-spacing="-5">IRONLOG</text>
    <text x="64" y="264" fill="var(--text)" font-size="30" font-weight="700">Train. Recover. Prove it.</text>
    <text x="64" y="314" fill="var(--muted)" font-size="18">Log every set, run and ride in one local-first record.</text>
    <text x="64" y="342" fill="var(--muted)" font-size="18">Read recovery, earn the Ledger, plan the next session.</text>
    <g transform="translate(64 384)">
      <rect width="176" height="34" rx="17" fill="var(--panel)" stroke="var(--line)"/>
      <circle cx="20" cy="17" r="5" fill="var(--mint)" class="pulse"/>
      <text x="34" y="22" fill="var(--text)" font-size="12.5" font-weight="700" letter-spacing="1">LOCAL-FIRST DATA</text>
      <rect x="188" width="150" height="34" rx="17" fill="var(--panel)" stroke="var(--line)"/>
      <text x="206" y="22" fill="var(--text)" font-size="12.5" font-weight="700" letter-spacing="1">ANDROID + WEB</text>
      <rect x="350" width="128" height="34" rx="17" fill="var(--panel)" stroke="var(--line)"/>
      <text x="368" y="22" fill="var(--text)" font-size="12.5" font-weight="700" letter-spacing="1">APACHE 2.0</text>
    </g>
    <g transform="translate(64 456)">
      <text y="5" fill="var(--muted)" font-size="12" font-weight="700" letter-spacing="2">THEMES</text>
      <circle cx="78" cy="0" r="8" fill="#65da94" stroke="#1c1c1c" stroke-width="3"/>
      <circle cx="100" cy="0" r="8" fill="#a0f1bd" stroke="#000000" stroke-width="3"/>
      <circle cx="122" cy="0" r="8" fill="#86bdff" stroke="#05070b" stroke-width="3"/>
      <circle cx="144" cy="0" r="8" fill="#d2bbff" stroke="#0b1326" stroke-width="3"/>
      <text x="162" y="5" fill="var(--muted)" font-size="12">+ more</text>
    </g>
  </g>

  <!-- Active workout card: progress perimeter, rest countdown, breathing rest wave -->
  <g font-family="Arial,Helvetica,sans-serif">
    <rect x="652" y="52" width="500" height="176" rx="22" fill="var(--card)" stroke="var(--faint)" stroke-width="2"/>
    <rect x="652" y="52" width="500" height="176" rx="22" fill="none" stroke="var(--mint)" stroke-width="3" stroke-linecap="round" class="progress"/>
    <text x="680" y="88" fill="var(--mint)" font-size="12" font-weight="800" letter-spacing="2">IN PROGRESS · PUSH</text>
    <text x="680" y="126" fill="var(--text)" font-size="26" font-weight="900">Barbell Bench Press</text>
    <text x="680" y="152" fill="var(--muted)" font-size="15">Set 3 of 4 · 80 kg × 8 · RIR 2</text>
    <text x="1124" y="126" text-anchor="end" fill="var(--mint)" font-size="30" font-weight="900">1:24</text>
    <text x="1124" y="152" text-anchor="end" fill="var(--muted)" font-size="13" font-weight="700" letter-spacing="1">REST</text>
    <clipPath id="waveClip"><rect x="680" y="178" width="300" height="22" rx="11"/></clipPath>
    <rect x="680" y="186" width="380" height="6" rx="3" fill="var(--faint)"/>
    <g clip-path="url(#waveClip)">
      <g class="breathe">
        <path class="wave" d="M680 189 q9 -8 18 0 t18 0 t18 0 t18 0 t18 0 t18 0 t18 0 t18 0 t18 0 t18 0 t18 0 t18 0 t18 0 t18 0 t18 0 t18 0 t18 0 t18 0 t18 0" fill="none" stroke="var(--mint)" stroke-width="5" stroke-linecap="round"/>
      </g>
    </g>
    <text x="1124" y="194" text-anchor="end" fill="var(--muted)" font-size="13">9 / 18 sets</text>
  </g>

  <!-- GPS route card: the route draws itself and a runner follows it -->
  <g font-family="Arial,Helvetica,sans-serif">
    <rect x="652" y="248" width="500" height="220" rx="22" fill="var(--card)" stroke="var(--faint)" stroke-width="2"/>
    <path d="M700 300 L1110 280 M690 362 L1130 346 M780 442 L1110 418 M820 262 L860 460 M960 262 L990 458 M1060 262 L1080 452" stroke="var(--line)" stroke-width="1.5" opacity=".7" fill="none"/>
    <path d="M850 418 C 880 372, 906 384, 928 352 S 982 302, 1010 326 S 1056 352, 1076 308 S 1100 264, 1122 278" fill="none" stroke="var(--blue)" stroke-width="5" stroke-linecap="round" opacity=".25"/>
    <path id="routePath" d="M850 418 C 880 372, 906 384, 928 352 S 982 302, 1010 326 S 1056 352, 1076 308 S 1100 264, 1122 278" fill="none" stroke="var(--blue)" stroke-width="5" stroke-linecap="round" class="route"/>
    <circle r="8" fill="var(--blue)" stroke="var(--card)" stroke-width="3" class="runner">
      <animateMotion dur="7s" repeatCount="indefinite" keyPoints="0;0;1;1;0" keyTimes="0;0.08;0.6;0.92;1" calcMode="linear"><mpath href="#routePath"/></animateMotion>
    </circle>
    <circle cx="1122" cy="278" r="8" fill="var(--blue)" stroke="var(--card)" stroke-width="3" class="runner-static"/>
    <text x="680" y="286" fill="var(--blue)" font-size="12" font-weight="800" letter-spacing="2">RUN · GPS</text>
    <text x="680" y="440" fill="var(--text)" font-size="30" font-weight="900">4.12 km</text>
    <text x="680" y="460" fill="var(--muted)" font-size="13">5:41 /km · 23:25</text>
    <rect x="1040" y="424" width="88" height="30" rx="15" fill="var(--card)" stroke="var(--line)"/>
    <text x="1084" y="444" text-anchor="middle" fill="var(--text)" font-size="12" font-weight="800" letter-spacing="1">3D REPLAY</text>
  </g>
</svg>
