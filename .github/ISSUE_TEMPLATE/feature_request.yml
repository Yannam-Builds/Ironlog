name: Feature request
description: Propose a focused improvement to IronLog
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Training problem
      description: What becomes difficult during or around a real workout?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the result, not only a UI control.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        [
          Workout logging,
          Plans,
          Recovery,
          Progress and stats,
          Iron Ledger,
          Widgets,
          Data portability,
          Health Connect,
          Intelligence,
          Other,
        ]
    validations:
      required: true
